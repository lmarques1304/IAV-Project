<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recycle Islands VR - Glass Island</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="../js/island.js"></script>
    <script src="../js/simple-grab.js"></script>
    <script src="../js/delete-on-contact.js"></script>
    <script src="../js/garbage-throw-increment-and-sound.js"></script>
    <script src="../js/random-spawner.js"></script>
  </head>

  <body oncontextmenu="return false">
    <a-scene physics="gravity: -9.8; debug: false" game-manager island-setup>
      <a-assets>
        <a-asset-item
          id="glassItem1"
          src="../assets/glass-trash/simple_glass_cup.glb"
        ></a-asset-item>

        <a-asset-item
          id="glassItem2"
          src="../assets/glass-trash/low_poly_wine_bottle.glb"
        ></a-asset-item>

        <a-asset-item
          id="binModel"
          src="../assets/glass-trash/glass_jar.glb"
        ></a-asset-item>

        <audio
          id="background-music"
          src="../assets/sounds/background-music.wav"
          preload="auto"
        ></audio>

        <audio id="bin-sound" src="../assets/sounds/bin-sound.wav"></audio>

        <a-asset-item
          id="decorBench"
          src="../assets/glass-trash/low_poly_bench.glb"
        ></a-asset-item>
        <a-asset-item
          id="decorRocks"
          src="../assets/glass-trash/low_poly_rocks.glb"
        ></a-asset-item>
        <a-asset-item
          id="decorTree"
          src="../assets/glass-trash/low_poly_tree.glb"
        ></a-asset-item>
      </a-assets>

      <a-entity id="defaultLight"></a-entity>
      <a-entity id="sunLight" position="1 1 0"></a-entity>
      <a-sky color="#87CEEB"></a-sky>

      <a-light
        type="point"
        color="#ffffff"
        intensity="1"
        distance="500"
        position="0 20 0"
      ></a-light>

      <a-entity
        id="rig"
        movement-controls="fly: false; speed: 0.2"
        stay-in-bounds="xRange: 29; zRange: 29"
      >
        <a-camera position="0 0.5 0">
          <a-entity
            sound="src: #background-music; autoplay: true; loop: true; volume: 0.2 positional: false"
          ></a-entity>
        </a-camera>

        <a-entity
          id="left-hand"
          hand-controls="hand: left; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>

        <a-entity
          id="right-hand"
          hand-controls="hand: right; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>
      </a-entity>

      <a-entity id="counter-display" position="0 1.5 -5" scale="1.5 1.5 1.5">
        <a-plane
          color="#000000"
          opacity="0.5"
          width="2"
          height="0.5"
          position="0 0 -0.1"
        ></a-plane>

        <a-entity
          id="counter"
          text="value: Items collected: 0/10; color: #FFFFFF; align: center; width: 3.5"
          position="0 0 0"
        ></a-entity>
      </a-entity>

      <a-entity
        id="bin"
        gltf-model="#binModel"
        position="0 0.7 -5"
        scale="0.8 0.8 0.8"
        static-body
        delete-on-contact
      >
      </a-entity>

      <a-entity
        sound="src: #bin-sound; volume: 1.4 positional: false"
        id="garbage-throw-sound"
      ></a-entity>

      <a-box
        class="ground"
        position="0 -1 0"
        scale="60 60 1"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Grass005_1K-JPG/Grass005_1K-JPG_Color.jpg"
        repeat="60 60"
        static-body
      >
      </a-box>

      <a-plane
        id="ocean"
        position="0 -1.1 0"
        width="1000"
        height="1000"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ice003_1K-JPG/Ice003_1K-JPG_Color.jpg"
        repeat="1000 1000"
        static-body
      >
      </a-plane>

      <a-entity
        random-spawner="model: #decorTree; count: 15; scale: 2.5 2.5 2.5; areaSize: 45; yPos: 10"
      ></a-entity>
      <a-entity
        random-spawner="model: #decorBench; count: 3; scale: 1.5 1.5 1.5; areaSize: 45; yPos: 0.2"
      ></a-entity>
      <a-entity
        random-spawner="model: #decorRocks; count: 10; scale: 1 1 1; areaSize: 45; yPos: 0"
      ></a-entity>

      <!-- <a-entity
        random-spawner="model: #glassItem1; count: 20; scale: 0.2 0.2 0.2; yPos: -0.4; rotationType: random; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #glassItem2; count: 20; scale: 1 1 1; yPos: 2; rotationType: random; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #glassItem3; count: 15; scale: 0.15 0.15 0.15; yPos: 0.5; rotationType: random; isGrabbable: true; physics: dynamic"
      ></a-entity> -->

      <script>
        const sandWidth = 55;
        const sandHeight = 55;
        const sandOffsetZ = 0;

        const createTrash = (modelId, count, scale, yPos, rotationType) => {
          const scene = document.querySelector("a-scene");

          for (let i = 0; i < count; i++) {
            // 1. Create a Wrapper Entity (The "Physical" Object)
            // We use a primitive box so physics is guaranteed to work immediately
            const wrapper = document.createElement("a-entity");

            // Calculate Position
            const x = Math.random() * sandWidth - sandWidth / 2;
            const z = Math.random() * sandHeight - sandHeight / 2 + sandOffsetZ;
            wrapper.setAttribute("position", `${x} ${yPos} ${z}`);

            // PHYSICS & INTERACTION (Applied to the Wrapper)
            wrapper.setAttribute("class", "grabbable");

            // We give it a real geometry so the physics engine has data, but make it invisible.
            // 0.25 (25cm) is a perfect size for VR hands to grab.
            wrapper.setAttribute(
              "geometry",
              "primitive: box; width: 0.25; height: 0.25; depth: 0.25"
            );
            wrapper.setAttribute("material", "visible: false"); // Invisible hit box

            // 2. Create the Visual Model (The "Child")
            const visual = document.createElement("a-entity");
            visual.setAttribute("gltf-model", modelId);
            visual.setAttribute("scale", scale);

            // Center the visual inside the physics box (tweak if needed)
            visual.setAttribute("position", "0 -0.1 0");

            // Apply Rotation to the visual (so the physics box stays aligned effectively)
            if (rotationType === "random") {
              visual.setAttribute("rotation", `0 ${Math.random() * 360} 0`);
            } else if (rotationType === "lying") {
              visual.setAttribute("rotation", `90 0 ${Math.random() * 360}`);
            }

            // 3. Assemble
            wrapper.appendChild(visual); // Put visual inside the physics wrapper
            scene.appendChild(wrapper); // Put wrapper in the scene
          }
        };

        // Generate the items
        // Note: We can likely use yPos = 1 or 2 to ensure they don't spawn inside the floor
        createTrash("#glassItem1", 20, "0.2 0.2 0.2", 0.5, "random");
        createTrash("#glassItem2", 15, "0.005 0.005 0.005", 0, "random");
      </script>
    </a-scene>
  </body>
</html>
