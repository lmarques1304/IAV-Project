<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recycle Islands VR - Electronic Island</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="../js/island.js" defer></script>
    <script src="../js/simple-grab.js" defer></script>
    <script src="../js/delete-on-contact.js" defer></script>
    <script src="../js/garbage-throw-increment-and-sound.js" defer></script>
    <script src="../js/random-spawner.js" defer></script>
  </head>

  <body oncontextmenu="return false">
    <a-scene
      physics="gravity: -9.8; debug: false"
      fog="type: exponential; color: #050510; density: 0.04;"
      game-manager
    >
      <a-assets>
        <a-asset-item
          id="decorRack"
          src="../assets/eletronic-trash/server_rack.glb"
        ></a-asset-item>

        <a-asset-item
          id="decorCrate"
          src="../assets/eletronic-trash/crate.glb"
        ></a-asset-item>
                       
        <a-asset-item
          id="eWasteItem1"
          src="../assets/eletronic-trash/broken_smartphone_glb__fbx__textures.glb"
        ></a-asset-item>
               
        <a-asset-item
          id="eWasteItem2"
          src="../assets/eletronic-trash/flashlight.glb"
        ></a-asset-item>
               
        <a-asset-item
          id="eWasteItem3"
          src="../assets/eletronic-trash/cc0_set_of_electronic_components.glb"
        ></a-asset-item>
                       
        <a-asset-item
          id="binModel"
          src="../assets/eletronic-trash/washing_machine.glb"
        ></a-asset-item>

               
        <audio
          id="background-music"
          src="../assets/sounds/background-music.wav"
          preload="auto"
        ></audio>
               
        <audio id="bin-sound" src="../assets/sounds/bin-sound.wav"></audio>    
         
      </a-assets>
                       
      <a-entity
        id="next-island-portal"
        position="0 1 -15"
        rotation="0 0 0"
        scale="0 0 0"
        visible="false"
        class="clickable"
        navigate-on-click="url: plastic.html"
      >
               
        <a-sphere
          radius="1"
          color="#FF00FF"
          opacity="0.7"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
          event-set__hoveron="material.color: #FFFFFF"
          event-set__hoveroff="material.color: #FF00FF"
        >
                 
        </a-sphere>
               
        <a-text
          value="IR PARA ILHA PLÁSTICA"
          align="center"
          color="#000000"
          position="0 0 1.1"
          rotation="0 0 0"
          width="5"
        ></a-text>
             
      </a-entity>
      <a-sky color="#050510"></a-sky>
      <a-light
        type="point"
        color="#ffffff"
        intensity="1"
        distance="500"
        position="0 20 0"
      ></a-light>

      <a-entity id="rig" movement-controls="fly: false; speed: 0.2">
        <a-camera position="0 0.5 0">
          <a-entity
            sound="src: #background-music; autoplay: true; loop: true; volume: 0.2 positional: false"
          ></a-entity>
        </a-camera>
        <a-entity
          id="left-hand"
          hand-controls="hand: left; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>

        <a-entity
          id="right-hand"
          hand-controls="hand: right; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>
      </a-entity>

      <a-entity id="counter-display" position="0 1.5 -5" scale="1.5 1.5 1.5">
               
        <a-plane
          color="#000000"
          opacity="0.5"
          width="2"
          height="0.5"
          position="0 0 -0.1"
        ></a-plane>
               
        <a-entity
          id="counter"
          text="value: Items collected: 0/10; color: #FFFFFF; align: center; width: 3.5"
          position="0 0 0"
        ></a-entity>
             
      </a-entity>

                 
      <a-entity
        id="bin"
        gltf-model="#binModel"
        position="0 0.5 -5"
        scale="1 1 1"
        rotation="0 90 0"
        static-body
        delete-on-contact
      >
             
      </a-entity>

           
      <a-entity
        sound="src: #bin-sound; volume: 1.4 positional: false"
        id="garbage-throw-sound"
      ></a-entity>

                 
      <a-box
        class="ground"
        position="0 -1 0"
        scale="60 60 1"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Concrete035_1K-JPG/Concrete035_1K-JPG_Color.jpg"
        repeat="60 60"
        static-body
      >
             
      </a-box>

                 
      <a-plane
        id="ocean"
        position="0 -1.1 0"
        width="1000"
        height="1000"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ice003_1K-JPG/Ice003_1K-JPG_Color.jpg"
        repeat="1000 1000"
        static-body
      >
      </a-plane>

      <a-entity
        random-spawner="model: #decorRack; count: 10; scale: 3 3 3; areaSize: 45; yPos: -0.5; physics: static"
      ></a-entity>
      <a-entity
        random-spawner="model: #decorCrate; count: 10; scale: 0.01 0.01 0.01; areaSize: 45; yPos: -0.5; physics: static"
      ></a-entity>

      <a-entity
        random-spawner="model: #eWasteItem1; count: 25; scale: 0.6 0.8 0.6; yPos: 0.2; rotationType: lying; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #eWasteItem2; count: 10; scale: 0.02 0.02 0.02; yPos: 0.1; rotationType: random; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #eWasteItem3; count: 15; scale: 8 8 8; yPos: 0.2; rotationType: lying; isGrabbable: true; physics: dynamic"
      ></a-entity>
    </a-scene>
  </body>
</html>
