<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recycle Islands VR - Plastic Island</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="../js/island.js"></script>
    <script src="../js/simple-grab.js"></script>
    <script src="../js/delete-on-contact.js"></script>
    <script src="../js/garbage-throw-increment-and-sound.js"></script>
    <script src="../js/random-spawner.js"></script>
  </head>

  <body oncontextmenu="return false">
    <a-scene physics="gravity: -9.8; debug: false" game-manager island-setup>
      <a-assets>
        <a-asset-item
          id="palmModel"
          src="../assets/textures/Trees/Palm.glb"
        ></a-asset-item>
        <a-asset-item
          id="plasticItem1"
          src="../assets/plastic/Bottle.glb"
        ></a-asset-item>
        <a-asset-item
          id="plasticItem2"
          src="../assets/plastic/Soda.glb"
        ></a-asset-item>
        <a-asset-item
          id="plasticItem3"
          src="../assets/plastic/bag.glb"
        ></a-asset-item>
        <a-asset-item
          id="binModel"
          src="../assets/bins/plastic-bin.glb"
        ></a-asset-item>
        <audio
          id="background-music"
          src="../assets/sounds/background-music.wav"
          preload="auto"
        ></audio>
        <audio id="bin-sound" src="../assets/sounds/bin-sound.wav"></audio>

        <a-asset-item
          id="beachBar"
          src="../assets/beach/Bar.glb"
        ></a-asset-item>
        <a-asset-item
          id="umbrella"
          src="../assets/beach/Umbrella_and_chairs.glb"
        ></a-asset-item>
        <a-asset-item
          id="surfboard"
          src="../assets/beach/Surfboard.glb"
        ></a-asset-item>
        <a-asset-item
          id="castle"
          src="../assets/beach/Sand_castle.glb"
        ></a-asset-item>
        <a-asset-item id="crab" src="../assets/beach/Crab.glb"></a-asset-item>
        <a-asset-item
          id="beachBall"
          src="../assets/beach/beach_ball.glb"
        ></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>

      <a-light
        type="point"
        color="#ffdca8"
        intensity="2"
        distance="500"
        position="0 20 0"
      ></a-light>

      <a-entity
        id="player"
        movement-controls="fly: false; speed: 0.2"
        stay-in-bounds="xRange: 29; zRange: 29"
      >
        <a-camera position="0 0.5 0">
          <a-entity
            sound="src: #background-music; autoplay: true; loop: true; volume: 0.2 positional: false"
          ></a-entity>
        </a-camera>

        <a-entity
          id="left-hand"
          hand-controls="hand: left; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>

        <a-entity
          id="right-hand"
          hand-controls="hand: right; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>
      </a-entity>

      <a-entity id="counter-display" position="0 1.5 -5" scale="1.5 1.5 1.5">
        <a-plane
          color="#000000"
          opacity="0.5"
          width="2"
          height="0.5"
          position="0 0 -0.1"
        ></a-plane>
        <a-entity
          id="counter"
          text="value: Items collected: 0/10; color: #FFFFFF; align: center; width: 3.5"
          position="0 0 0"
        ></a-entity>
      </a-entity>

      <a-entity
        id="bin"
        gltf-model="#binModel"
        position="0 -0.5 -5"
        static-body
        shape="box"
        delete-on-contact
      >
      </a-entity>

      <a-entity
        sound="src: #bin-sound; volume: 1.4 positional: false"
        id="garbage-throw-sound"
      ></a-entity>

      <a-box
        class="ground"
        position="0 -1 0"
        scale="60 60 1"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ground093C_1K-JPG/Ground093C_1K-JPG_Color.jpg"
        repeat="60 60"
        static-body
      >
      </a-box>
      <a-plane
        id="ocean"
        position="0 -1 0"
        width="1000"
        height="1000"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ice003_1K-JPG/Ice003_1K-JPG_Color.jpg"
        repeat="1000 1000"
        static-body
      >
      </a-plane>

      <a-entity
        random-spawner="model: #palmModel; count: 10; scale: 2 2 2; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #palmModel; count: 8; scale: 2.5 2.5 2.5; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #palmModel; count: 6; scale: 3.5 3.5 3.5; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #palmModel; count: 4; scale: 4 4 4; yPos: -0.5"
      ></a-entity>

      <!-- <a-entity
        random-spawner="model: #plasticItem1; count: 30; scale: 0.1 0.1 0.1; yPos: -0.4; rotationType: lying; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #plasticItem2; count: 30; scale: 2 2 2; yPos: -0.4; rotationType: random; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #plasticItem3; count: 20; scale: 3 3 3; yPos: -0.2; rotationType: random; isGrabbable: true; physics: dynamic"
      ></a-entity> -->

      <a-entity
        random-spawner="model: #surfboard; count: 4; scale: 0.1 0.1 0.1; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #castle; count: 4; scale: 0.05 0.05 0.05; yPos: -0.5"
      ></a-entity>
      <a-entity
        position="15 -0.5 -15"
        rotation="0 -45 0"
        scale="3 3 3"
        gltf-model="#beachBar"
      ></a-entity>

      <script>
        const sandWidth = 55;
        const sandHeight = 55;
        const sandOffsetZ = 0;

        const createPlastic = (modelId, count, scale, yPos, rotationType) => {
          for (let i = 0; i < count; i++) {
            const plastic = document.createElement("a-entity");
            plastic.setAttribute("gltf-model", modelId);
            const x = Math.random() * sandWidth - sandWidth / 2;
            const z = Math.random() * sandHeight - sandHeight / 2 + sandOffsetZ;
            plastic.setAttribute("position", `${x} ${yPos} ${z}`);
            plastic.setAttribute("scale", scale);

            if (rotationType === "random") {
              plastic.setAttribute("rotation", `0 ${Math.random() * 360} 0`);
            } else if (rotationType === "lying") {
              plastic.setAttribute("rotation", `90 0 ${Math.random() * 360}`);
            }

            // CRITICAL: Must have 'grabbable' class
            plastic.setAttribute("class", "grabbable");
            // Physics
            plastic.setAttribute("dynamic-body", "mass: 0.2; shape: auto");
            document.querySelector("a-scene").appendChild(plastic);
          }
        };

        createPlastic("#plasticItem1", 55, "0.1 0.1 0.1", -0.4, "lying");
        createPlastic("#plasticItem2", 70, "2 2 2", -0.4, "random");
        createPlastic("#plasticItem3", 10, "3 3 3", -0.2, "random");
      </script>
    </a-scene>
  </body>
</html>
