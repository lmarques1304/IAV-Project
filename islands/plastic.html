<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recycle Islands VR - Plastic Island</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="../js/island.js" defer></script>
    <script src="../js/simple-grab.js" defer></script>
    <script src="../js/delete-on-contact.js" defer></script>
    <script src="../js/garbage-throw-increment-and-sound.js" defer></script>
    <script src="../js/random-spawner.js" defer></script>
  </head>

  <body>
    <a-scene physics="gravity: -9.8; debug: false" game-manager>
      <a-assets>
        <a-asset-item
          id="palmModel"
          src="../assets/textures/Trees/Palm.glb"
        ></a-asset-item>
        <a-asset-item
          id="plasticItem1"
          src="../assets/plastic/Bottle.glb"
        ></a-asset-item>
        <a-asset-item
          id="plasticItem2"
          src="../assets/plastic/Soda.glb"
        ></a-asset-item>
        <a-asset-item
          id="plasticItem3"
          src="../assets/plastic/bag.glb"
        ></a-asset-item>
        <a-asset-item
          id="binModel"
          src="../assets/bins/plastic-bin.glb"
        ></a-asset-item>
        <audio
          id="background-music"
          src="../assets/sounds/background-music.wav"
          preload="auto"
        ></audio>
        <audio id="bin-sound" src="../assets/sounds/bin-sound.wav"></audio>

        <a-asset-item
          id="beachBar"
          src="../assets/beach/Bar.glb"
        ></a-asset-item>
        <a-asset-item
          id="umbrella"
          src="../assets/beach/Umbrella_and_chairs.glb"
        ></a-asset-item>
        <a-asset-item
          id="surfboard"
          src="../assets/beach/Surfboard.glb"
        ></a-asset-item>
        <a-asset-item
          id="castle"
          src="../assets/beach/Sand_castle.glb"
        ></a-asset-item>
        <a-asset-item id="crab" src="../assets/beach/Crab.glb"></a-asset-item>
        <a-asset-item
          id="beachBall"
          src="../assets/beach/beach_ball.glb"
        ></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>

      <a-light
        type="point"
        color="#ffdca8"
        intensity="2"
        distance="500"
        position="0 20 0"
      ></a-light>

      <!-- PLAYER -->
      <a-entity id="player" movement-controls="fly: false; speed: 0.2">
        <a-camera position="0 0.5 0">
          <a-entity
            sound="src: #background-music; autoplay: true; loop: true; volume: 0.2 positional: false"
          ></a-entity>
        </a-camera>

        <a-entity
          id="left-hand"
          hand-controls="hand: left; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>

        <a-entity
          id="right-hand"
          hand-controls="hand: right; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>
      </a-entity>

      <!-- BIN AND COUNTER -->
      <a-entity id="counter-display" position="0 1.5 -5" scale="1.5 1.5 1.5">
        <a-plane
          color="#000000"
          opacity="0.5"
          width="2"
          height="0.5"
          position="0 0 -0.1"
        ></a-plane>
        <a-entity
          id="counter"
          text="value: Items collected: 0/10; color: #FFFFFF; align: center; width: 3.5"
          position="0 0 0"
        ></a-entity>
      </a-entity>

      <a-entity
        id="bin"
        gltf-model="#binModel"
        position="0 -0.5 -5"
        static-body
        delete-on-contact
      >
      </a-entity>

      <a-entity
        sound="src: #bin-sound; volume: 1.4 positional: false"
        id="garbage-throw-sound"
      ></a-entity>

      <!-- ISLAND -->
      <a-box
        class="ground"
        position="0 -1 0"
        scale="60 60 1"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ground093C_1K-JPG/Ground093C_1K-JPG_Color.jpg"
        repeat="60 60"
        static-body
      >
      </a-box>

      <a-plane
        id="ocean"
        position="0 -1 0"
        width="1000"
        height="1000"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ice003_1K-JPG/Ice003_1K-JPG_Color.jpg"
        repeat="1000 1000"
        static-body
      >
      </a-plane>

      <!-- DECORATIONS AND TRASH ITEMS -->

      <a-entity
        random-spawner="model: #palmModel; count: 10; scale: 2 2 2; areaSize: 45; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #palmModel; count: 8; scale: 2.5 2.5 2.5; areaSize: 45; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #palmModel; count: 6; scale: 3.5 3.5 3.5; areaSize: 45; yPos: -0.5"
      ></a-entity>
      <a-entity
        random-spawner="model: #palmModel; count: 4; scale: 4 4 4; areaSize: 45; yPos: -0.5"
      ></a-entity>

      <a-entity
        random-spawner="model: #plasticItem1; count: 55; scale: 0.1 0.1 0.1; rotationType: lying; yPos: -0.4; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #plasticItem2; count: 50; scale: 2 2 2; yPos: -0.2; isGrabbable: true; physics: dynamic"
      ></a-entity>
      <a-entity
        random-spawner="model: #plasticItem3; count: 50; scale: 3 3 3; yPos: -0.1; isGrabbable: true; physics: dynamic"
      ></a-entity>

      <a-entity
        random-spawner="model: #castle; count: 3; scale: 0.05 0.05 0.05; yPos: -0.5; physics: static"
      ></a-entity>
      <a-entity
        random-spawner="model: #surfboard; count: 3; scale: 0.1 0.1 0.1; yPos: -0.5; physics: static"
      ></a-entity>

      <a-entity
        gltf-model="#beachBar"
        position="15 -0.5 -15"
        rotation="0 -45 0"
        scale="3 3 3"
        static-body
      >
      </a-entity>
    </a-scene>
  </body>
</html>
