<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recycle Islands VR - Organic Island</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="../js/island.js"></script>
    <script src="../js/simple-grab.js"></script>
    <script src="../js/delete-on-contact.js"></script>
    <script src="../js/garbage-throw-increment-and-sound.js"></script>
    <script src="../js/random-spawner.js"></script>
  </head>

  <body oncontextmenu="return false">
    <a-scene physics="gravity: -9.8; debug: false" game-manager island-setup>
      <a-assets>
        <a-asset-item
          id="organicItem1"
          src="../assets/organic-trash/apple_with_a_bite.glb"
        ></a-asset-item>
        <a-asset-item
          id="organicItem2"
          src="../assets/organic-trash/banana.glb"
        ></a-asset-item>
        <a-asset-item
          id="organicItem3"
          src="../assets/organic-trash/rotten_dirty_organic_waste.glb"
        ></a-asset-item>
        <a-asset-item
          id="binModel"
          src="../assets/organic-trash/sci_fi_trash_can.glb"
        ></a-asset-item>
        <audio
          id="background-music"
          src="../assets/sounds/background-music.wav"
          preload="auto"
        ></audio>
        <audio id="bin-sound" src="../assets/sounds/bin-sound.wav"></audio>
      </a-assets>

      <a-sky color="#6A8D73"></a-sky>
      <a-light
        type="point"
        color="#ffffff"
        intensity="1"
        distance="500"
        position="0 20 0"
      ></a-light>

      <a-entity
        id="player"
        movement-controls="fly: false; speed: 0.2"
        stay-in-bounds="xRange: 29; zRange: 29"
      >
        <a-camera position="0 0.5 0">
          <a-entity
            sound="src: #background-music; autoplay: true; loop: true; volume: 0.2 positional: false"
          ></a-entity>
        </a-camera>

        <a-entity
          id="left-hand"
          hand-controls="hand: left; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>

        <a-entity
          id="right-hand"
          hand-controls="hand: right; modelStyle: highPoly"
          sphere-collider="objects: .grabbable; radius: 0.7"
          simple-grab
        >
        </a-entity>
      </a-entity>

      <a-entity id="counter-display" position="0 1.5 -5" scale="1.5 1.5 1.5">
        <a-plane
          color="#000000"
          opacity="0.5"
          width="2"
          height="0.5"
          position="0 0 -0.1"
        ></a-plane>
        <a-entity
          id="counter"
          text="value: Items collected: 0/10; color: #FFFFFF; align: center; width: 3.5"
          position="0 0 0"
        ></a-entity>
      </a-entity>

      <a-entity
        id="bin"
        gltf-model="#binModel"
        position="0 0.5 -5"
        scale="1 1 1"
        static-body
        delete-on-contact
      >
      </a-entity>

      <a-entity
        sound="src: #bin-sound; volume: 1 positional: false"
        id="garbage-throw-sound"
      ></a-entity>

      <a-box
        class="ground"
        position="0 -1 0"
        scale="60 60 1"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Mud002_1K-JPG/Mud002_1K-JPG_Color.jpg"
        repeat="60 60"
        static-body
      >
      </a-box>

      <a-plane
        id="ocean"
        position="0 -1.1 0"
        width="1000"
        height="1000"
        rotation="-90 0 0"
        src="../assets/textures/Ground/Ice003_1K-JPG/Ice003_1K-JPG_Color.jpg"
        repeat="1000 1000"
        static-body
      ></a-plane>

      <script>
        const sandWidth = 55;
        const sandHeight = 55;
        const sandOffsetZ = 0; // Função genérica para criar lixo na ilha

        const createTrash = (modelId, count, scale, yPos, rotationType) => {
          for (let i = 0; i < count; i++) {
            const trash = document.createElement("a-entity");
            trash.setAttribute("gltf-model", modelId);

            const x = Math.random() * sandWidth - sandWidth / 2;
            const z = Math.random() * sandHeight - sandHeight / 2 + sandOffsetZ;
            trash.setAttribute("position", `${x} ${yPos} ${z}`);
            trash.setAttribute("scale", scale);

            if (rotationType === "random") {
              trash.setAttribute("rotation", `0 ${Math.random() * 360} 0`);
            } else if (rotationType === "lying") {
              trash.setAttribute("rotation", `90 0 ${Math.random() * 360}`);
            }

            trash.setAttribute("class", "grabbable");
            trash.setAttribute("dynamic-body", "mass: 0.5; shape: auto");

            document.querySelector("a-scene").appendChild(trash);
          }
        };

        createTrash("#organicItem1", 15, "0.15 0.15 0.15", -0.7, "lying");
        createTrash("#organicItem2", 15, "0.01 0.01 0.01", -0.7, "lying");
        createTrash("#organicItem3", 10, "0.08 0.08 0.08", -0.8, "lying");
      </script>
    </a-scene>
  </body>
</html>
